<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Merge Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Inventory Merge Assistant</h1>
        <p>Upload an Excel file to detect similar descriptions and merge inventory IDs.</p>
      </header>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form class="card" action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
        <label class="file-input">
          <span>Choose Excel file (.xlsx)</span>
          <input type="file" name="inventory_file" accept=".xlsx,.xls" required />
        </label>
        <button type="submit">Analyze Inventory</button>
      </form>

      <section class="card info">
        <h2>Expected Columns</h2>
        <ul>
          <li><strong>inventory_id</strong>: Unique inventory identifier.</li>
          <li><strong>description</strong>: Item description for similarity checking.</li>
        </ul>
      </section>
    </main>
  </body>
</html>
